name: Update docs website

on:
  push:
    branches: ['main']
    paths:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/update-docs-site.yml'

  workflow_dispatch:

jobs:
  dispatch-docs-site:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs website deploy
        env:
          GH_TOKEN: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing DOCS_SITE_DISPATCH_TOKEN. Add it as an Actions repository secret in mkarounos4/OS-PI-is-cool, not in the website repo."
            exit 1
          fi

          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/VeerKakar17/rpi-os-docs-website/dispatches \
            -d '{"event_type":"os-pi-docs-updated"}'
